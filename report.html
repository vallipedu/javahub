<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Practical Examination Award List</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== GLOBAL ===== */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f2f2f2;
}

.print-controls {
    position: fixed;
    top: 10px;
    right: 15px;
    z-index: 9999;
}

.print-controls button {
    background: #004d99;
    border: none;
    color: white;
    padding: 8px 14px;
    margin-left: 8px;
    border-radius: 5px;
    cursor: pointer;
}

/* ===== PAGE (final working version) ===== */
.page {
    width: 190mm;

    /* Increased height to correctly fit 15 rows on Page-1 */
    min-height: 240mm;

    padding: 14mm;
    margin: 14mm auto;
    background: white;
    box-sizing: border-box;
    position: relative;

    page-break-after: auto;
    page-break-inside: avoid;

    background-image: url('nbkrist-logo.png');
    background-repeat: no-repeat;
    background-position: center center;
    background-size: 300px;
}

@media print {
    .print-controls { display: none; }
    .page {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}

/* ===== HEADER ===== */
.header { text-align: center; margin-bottom: 10px; }
.header p {
    margin: 2px 0;
    font-size: 13px;
    color: #0057b7;
    font-weight: 600;
}
.header .institute-name { font-size: 16px; font-weight: bold; }
.header .sub-heading { margin-top: 6px; font-size: 14px; font-weight: bold; }

/* ===== DETAILS ===== */
.details-section { margin: 8px 0; }
.detail-row {
    display: grid;
    grid-template-columns: 200px 1fr;
    margin: 4px 0;
    font-size: 14px;
}
.value {
    border-bottom: 1px dashed #000;
    min-height: 18px;
    padding-left: 6px;
    font-style: italic;
}
.examiners-row {
    display: grid;
    grid-template-columns: 200px 25px 1fr;
    margin: 4px 0;
    font-size: 14px;
}
.e-value {
    font-style: italic;
    border-bottom: 1px dashed #000;
    min-height: 18px;
    padding-left: 6px;
}

.max-marks {
    border: 1px solid #000;
    width: 140px;
    padding: 5px;
    font-weight: bold;
    text-align: center;
    margin-left: auto;
    margin-bottom: 10px;
}

/* ===== TABLE ===== */
.marks-table {
    width: 100%;
    border-collapse: collapse;

    /* Reduced margin so 15 rows fit */
    margin-top: 8px;

    font-size: 13px;
}

.marks-table th, .marks-table td {
    border: 1px solid #000;
    padding: 6px;
    text-align: center;
}

/* Column widths */
.marks-table th:nth-child(1),
.marks-table td:nth-child(1) { width: 45px; }
.marks-table th:nth-child(2),
.marks-table td:nth-child(2) { width: 125px; }
.marks-table th:nth-child(3),
.marks-table td:nth-child(3) { width: 80px; }
.marks-table th:nth-child(4),
.marks-table td:nth-child(4) { width: 230px; }

.marks-table tbody tr:nth-child(odd) { background-color: #f4f8ff; }
.marks-table tbody tr:nth-child(even) { background-color: #ffffff; }

/* ===== FOOTER ===== */
.page-footer {
    border-top: 1px solid black;
    position: absolute;
    left: 14mm;
    right: 14mm;
    bottom: 10mm;

    /* Reduced footer height so 15 rows fit perfectly */
    height: 32mm;

    padding-top: 4px;
    background: white;
}

.footer-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    font-size: 14px;
}

.signature-line {
    display: grid;
    grid-template-columns: 25px auto;
    margin-bottom: 8px;
}

.signature-value {
    font-style: italic;
    border-bottom: 1px dashed #000;
    height: 18px;
}

.page-number {
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="print-controls">
    <button onclick="window.print()">Print</button>
    <button onclick="window.print()">Save PDF</button>
</div>

<div id="pagesContainer"></div>

<script>
function numberToWords(n){
    if (!n && n !== 0) return "";
    let map = {
        "0":"Zero","1":"One","2":"Two","3":"Three","4":"Four",
        "5":"Five","6":"Six","7":"Seven","8":"Eight","9":"Nine"
    };
    return String(n).split("").map(d => map[d]).join(" ");
}

let payload = JSON.parse(localStorage.getItem("assessmentData") || "{}");
let meta = payload.metadata || {};
let rows = Array.isArray(payload.rows) ? payload.rows.slice() : [];

/* FINAL FIXED ROW SETTINGS */
const FIRST_PAGE_ROWS = 12;
const NEXT_PAGE_ROWS = 21;

function paginateRows(all){
    const pages = [];
    pages.push(all.slice(0, FIRST_PAGE_ROWS));
    for (let i = FIRST_PAGE_ROWS; i < all.length; i += NEXT_PAGE_ROWS){
        pages.push(all.slice(i, i + NEXT_PAGE_ROWS));
    }
    return pages;
}

function headerHTML(){
    return `
    <div class="header">
        <p class="institute-name">N.B.K.R. INSTITUTE OF SCIENCE & TECHNOLOGY :: VIDYANAGAR</p>
        <p>(AUTONOMOUS)</p>
        <p>Affiliated to Jawaharlal Nehru Technological University Ananthapur</p>
        <p>B.TECH DEGREE END EXAMINATION</p>
        <p>(Strike off whichever is not applicable)</p>
        <p class="sub-heading">PRACTICAL EXAMINATION AWARD LIST</p>
    </div>

    <div class="details-section">
        <div class="detail-row"><span>Name of the Examination</span><span class="value">${meta.examName || ""}</span></div>
        <div class="detail-row"><span>Name of the Laboratory</span><span class="value">${meta.labName || ""}</span></div>
        <div class="detail-row"><span>Date(s) of Examination</span><span class="value">${meta.examDate || ""}</span></div>
        <div class="examiners-row"><span>Name of the Examiners</span><span>1.</span><span class="e-value">${meta.examiner1 || ""}</span></div>
        <div class="examiners-row"><span></span><span>2.</span><span class="e-value">${meta.examiner2 || ""}</span></div>
    </div>

    <div class="max-marks">Max Marks : 70</div>
    `;
}

function footerHTML(){
    return `
    <div class="page-footer">
        <div class="footer-section">
            <div>
                <div class="detail-row"><span>Number of Corrections (Figures)</span><span class="value"></span></div>
                <div class="detail-row"><span>(Words)</span><span class="value"></span></div>
            </div>
            <div>
                <div class="signature-line"><span>1.</span><span class="signature-value"></span></div>
                <div class="signature-line"><span>2.</span><span class="signature-value"></span></div>
                <p>Signature of the Examiners</p>
                <div class="detail-row"><span>Date</span><span class="value"></span></div>
            </div>
        </div>
        <div class="page-number"></div>
    </div>`;
}

function tableHeader(){
    return `
    <table class="marks-table">
    <thead>
        <tr>
            <th rowspan="2">S.No</th>
            <th rowspan="2">Register Number</th>
            <th colspan="2">Marks</th>
        </tr>
        <tr>
            <th>In Figures</th>
            <th>In Words</th>
        </tr>
    </thead>
    <tbody>`;
}

function buildPages(){
    let pages = paginateRows(rows);
    let container = document.getElementById("pagesContainer");
    container.innerHTML = "";

    pages.forEach((slice, p)=>{
        let html = `<div class="page">`;

        if (p === 0) html += headerHTML();

        html += tableHeader();

        slice.forEach((r, i)=>{
            let idx = p === 0 ? i + 1 : FIRST_PAGE_ROWS + (p - 1) * NEXT_PAGE_ROWS + i + 1;

            html += `
            <tr>
                <td>${idx}</td>
                <td>${r.roll}</td>
                <td>${r.total}</td>
                <td>${numberToWords(r.total)}</td>
            </tr>`;
        });

        html += `</tbody></table>`;
        html += footerHTML();
        html += `</div>`;

        container.innerHTML += html;
    });

    document.querySelectorAll(".page").forEach((pg, i)=>{
        pg.querySelector(".page-number").textContent =
            `Page ${i+1} of ${document.querySelectorAll(".page").length}`;
    });
}

buildPages();
</script>

</body>
</html>
